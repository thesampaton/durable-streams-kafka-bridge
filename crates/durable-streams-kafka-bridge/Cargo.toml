[package]
name = "durable-streams-kafka-bridge"
version = "0.2.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lightweight Kafka bridge built on durable-streams-client"
readme = "README.md"
keywords = ["durable-streams", "kafka", "bridge"]
categories = ["network-programming"]

[[bin]]
name = "durable-streams-kafka-bridge"
path = "src/main.rs"
required-features = ["rdkafka-producer"]

[lints]
workspace = true

[features]
default = ["rdkafka-producer"]
rdkafka-producer = ["dep:rdkafka"]

[dependencies]
async-trait = "0.1.89"
clap = { version = "4.5.48", features = ["derive"] }
durable-streams-client = { path = "../durable-streams-client" }
futures-util = "0.3.31"
rdkafka = { version = "0.38.0", features = ["cmake-build", "tokio"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["fs", "macros", "rt-multi-thread", "signal", "sync"] }
toml = "0.9.7"

[dev-dependencies]
axum = "0.8.6"
bytes = "1.10.1"
tokio = { version = "1.48.0", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
