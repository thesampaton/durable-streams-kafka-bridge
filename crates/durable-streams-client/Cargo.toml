[package]
name = "durable-streams-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reusable Rust client for the Durable Streams protocol"
readme = "README.md"
keywords = ["durable-streams", "streaming", "sse", "http"]
categories = ["network-programming", "web-programming::http-client"]

[lints]
workspace = true

[dependencies]
async-stream = "0.3.6"
base64 = "0.22.1"
bytes = "1.10.1"
futures-core = "0.3.31"
futures-util = "0.3.31"
rand = "0.9.2"
reqwest = { version = "0.12.24", default-features = false, features = ["charset", "http2", "json", "rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt", "time"] }
url = "2.5.7"

[dev-dependencies]
axum = "0.8.6"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
